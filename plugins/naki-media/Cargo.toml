[package]
name = "tauri-plugin-naki-media"
version = "0.1.0"
authors = [ "Naki Play" ]
description = "Motor Android e Windows de análise, download e conversão de mídia do Naki Play"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-naki-media"

[dependencies]
tauri = { version = "2.11.3" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
